<!DOCTYPE html>
<!-- Phone-first memory surface (#159). List, search and timeline; the graph is a drill-down on one
     memory. No canvas, no force layout, no 624 KB: this page is served whole in a few kilobytes. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 -apple-system, system-ui, sans-serif;
         background: #0b0d10; color: #e8ecf1; padding-bottom: env(safe-area-inset-bottom); }
  header { position: sticky; top: 0; z-index: 2; background: #10141a; padding: 10px 12px;
           border-bottom: 1px solid #1d2430; }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; letter-spacing: .02em; color: #9fb0c3; }
  .tabs { display: flex; gap: 8px; }
  .tab { flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center;
         border: 1px solid #222b38; border-radius: 10px; background: #141a22; color: #cbd6e2;
         font: inherit; }
  .tab[aria-selected="true"] { background: #1d2a3a; border-color: #2f4760; color: #fff; }
  input[type="search"] { width: 100%; min-height: 44px; margin-top: 8px; padding: 0 12px;
                         border-radius: 10px; border: 1px solid #222b38; background: #141a22;
                         color: #e8ecf1; font: inherit; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { border-bottom: 1px solid #161c25; }
  li a { display: block; min-height: 44px; padding: 12px; color: inherit; text-decoration: none; }
  .meta { font-size: 12px; color: #7d8ea1; margin-bottom: 3px; }
  .day { padding: 10px 12px 4px; font-size: 12px; color: #7d8ea1; text-transform: uppercase;
         letter-spacing: .06em; }
  footer { padding: 14px 12px 22px; font-size: 12px; color: #7d8ea1; }
  /* The sheet is a dialog that slides over the list, so the list keeps its scroll position. */
  #backdrop { position: fixed; inset: 0; background: #0009; opacity: 0; pointer-events: none;
              transition: opacity .18s ease; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; max-height: 80vh;
           overflow-y: auto; background: #10141a; border-top: 1px solid #222b38;
           border-radius: 16px 16px 0 0; transform: translateY(100%);
           transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom); }
  #sheet.open { transform: translateY(0); }
  #sheet header { position: static; border: 0; display: flex; align-items: center; gap: 8px; }
  #sheet h2 { font-size: 15px; margin: 0; flex: 1; color: #cbd6e2; font-weight: 600; }
  #sheet .close { min-height: 44px; min-width: 44px; border: 0; border-radius: 10px;
                  background: #1d2a3a; color: #e8ecf1; font: inherit; }
  #sheet .body { padding: 0 12px 18px; }
  #sheet .prov { font-size: 12px; color: #7d8ea1; margin: 6px 0 10px; }
  #sheet .rel { display: block; min-height: 44px; padding: 10px 12px; margin: 0 -12px;
                color: #9ecbff; text-decoration: none; border-top: 1px solid #161c25; }
  nav.detail { padding: 12px; }
  nav.detail a { display: block; min-height: 44px; padding: 10px 0; color: #9ecbff;
                 text-decoration: none; border-bottom: 1px solid #161c25; }
</style>
</head>
<body>
<header>
  <h1>Cortex — what I know</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="list" aria-selected="true">Recent</button>
    <button class="tab" role="tab" data-view="timeline" aria-selected="false">Timeline</button>
  </div>
  <input id="q" type="search" inputmode="search" placeholder="Search memories" autocomplete="off">
</header>
<main id="out" role="tabpanel"></main>
<footer id="foot"></footer>
<div id="backdrop"></div>
<section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
  <header>
    <h2 id="sheet-title">Memory</h2>
    <button class="close" id="sheet-close" aria-label="Close">✕</button>
  </header>
  <div class="body">
    <div class="prov" id="sheet-prov"></div>
    <div id="sheet-text"></div>
    <div id="sheet-rel"></div>
  </div>
</section>
<script>
(() => {
  let view = "list";
  const out = document.getElementById("out");
  const foot = document.getElementById("foot");
  const q = document.getElementById("q");

  const sheet = document.getElementById("sheet");
  const backdrop = document.getElementById("backdrop");
  const prov = document.getElementById("sheet-prov");
  const sheetText = document.getElementById("sheet-text");
  const sheetRel = document.getElementById("sheet-rel");
  const sheetTitle = document.getElementById("sheet-title");

  const closeSheet = () => {
    sheet.classList.remove("open");
    backdrop.classList.remove("open");
    sheet.setAttribute("aria-hidden", "true");
    document.getElementById("sheet-close").focus();
  };

  const openSheet = async (memoryId) => {
    sheet.classList.add("open");
    backdrop.classList.add("open");
    sheet.setAttribute("aria-hidden", "false");
    prov.textContent = "";
    sheetText.textContent = "Loading…";
    sheetRel.textContent = "";
    document.getElementById("sheet-close").focus();
    try {
      const reply = await fetch("/api/phone?view=sheet&memory_id=" + encodeURIComponent(memoryId),
                                { credentials: "same-origin" });
      if (!reply.ok) { sheetText.textContent = "Not available (" + reply.status + ")"; return; }
      const data = await reply.json();
      if (!data.found) { sheetTitle.textContent = "Not found"; sheetText.textContent = ""; return; }
      sheetTitle.textContent = data.memory.kind || "Memory";
      const bits = [data.provenance.created_at, data.provenance.kind, data.provenance.state,
                    "confidence " + data.provenance.confidence];
      if (data.provenance.source_type) bits.push(data.provenance.source_type);
      if (data.cited_by !== null && data.cited_by !== undefined) {
        bits.push(data.cited_by ? "cited by " + data.cited_by + " answer(s)" : "never cited");
      }
      prov.textContent = bits.filter(Boolean).join(" · ");
      sheetText.textContent = data.memory.text;
      for (const n of data.neighbours) {
        const link = document.createElement("a");
        link.className = "rel";
        link.href = "#";
        link.textContent = n.id.slice(0, 8) + "  ↔  " + n.weight;
        link.addEventListener("click", (event) => { event.preventDefault(); openSheet(n.id); });
        sheetRel.append(link);
      }
    } catch (error) {
      sheetText.textContent = "Offline.";
    }
  };

  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  backdrop.addEventListener("click", closeSheet);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && sheet.classList.contains("open")) closeSheet();
  });

  const row = (item) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#detail=" + item.id;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = [item.kind, item.state, item.created_at.slice(0, 10)].filter(Boolean).join(" · ");
    const text = document.createElement("div");
    text.textContent = item.text;
    a.append(meta, text);
    a.addEventListener("click", (event) => { event.preventDefault(); openSheet(item.id); });
    li.append(a);
    return li;
  };

  const draw = (data) => {
    out.textContent = "";
    if (data.view === "detail") {
      const nav = document.createElement("nav");
      nav.className = "detail";
      if (data.found) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = [data.memory.kind, data.memory.created_at.slice(0, 19)].join(" · ");
        const body = document.createElement("p");
        body.textContent = data.memory.text;
        nav.append(meta, body);
        for (const n of data.neighbours) {
          const a = document.createElement("a");
          a.href = "#detail=" + n.id;
          a.textContent = n.id.slice(0, 8) + "  ↔  " + n.weight;
          nav.append(a);
        }
      } else {
        nav.textContent = "Not found.";
      }
      out.append(nav);
      foot.textContent = "the graph, one memory at a time";
      return;
    }
    const list = document.createElement("ul");
    if (data.days) {
      for (const group of data.days) {
        const head = document.createElement("div");
        head.className = "day";
        head.textContent = group.day;
        out.append(head);
        for (const item of group.items) list.append(row(item));
      }
    } else {
      for (const item of data.items) list.append(row(item));
    }
    out.append(list);
    foot.textContent = data.more
      ? data.more + " more of " + data.total
      : data.total + " memories";
  };

  const load = async () => {
    const hash = location.hash.startsWith("#detail=") ? location.hash.slice(8) : "";
    const params = new URLSearchParams({ view: hash ? "detail" : (q.value ? "search" : view) });
    if (hash) params.set("memory_id", hash);
    if (q.value) params.set("query", q.value);
    try {
      const reply = await fetch("/api/phone?" + params.toString(), { credentials: "same-origin" });
      if (!reply.ok) { foot.textContent = "not available (" + reply.status + ")"; return; }
      draw(await reply.json());
    } catch (error) {
      foot.textContent = "offline";
    }
  };

  for (const tab of document.querySelectorAll(".tab")) {
    tab.addEventListener("click", () => {
      view = tab.dataset.view;
      location.hash = "";
      for (const other of document.querySelectorAll(".tab")) {
        other.setAttribute("aria-selected", String(other === tab));
      }
      load();
    });
  }
  let timer = null;
  q.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(() => { location.hash = ""; load(); }, 220);
  });
  window.addEventListener("hashchange", load);
  load();
})();
</script>
</body>
</html>
