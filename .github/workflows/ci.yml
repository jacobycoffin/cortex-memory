name: CI

on:
  push:
    branches:
      - main
      - testing
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml promises Python >=3.10. Exercise the minimum and every
        # current CPython feature release through 3.14.
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out Cortex
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install agent-neutral package and CLI
        run: |
          python -m pip install .
          cortex-memory --db "${RUNNER_TEMP}/cortex-package-smoke.db" stats

      - name: Test clean install and in-place upgrade
        env:
          PYTHON_BIN: python
        run: bash scripts/smoke_install_upgrade.sh

  embeddings:
    name: Local embeddings (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HERMES_HOME: ${{ runner.temp }}/cortex-embedding-tests
      CORTEX_REQUIRE_EMBEDDINGS: "1"
    steps:
      - name: Check out Cortex
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install optional embedding dependencies
        run: python -m pip install '.[embeddings]'

      - name: Download verified embedding artifacts
        run: python scripts/download_embedding_model.py --output "$HERMES_HOME/models/bge-small-en-v1.5"

      - name: Run full suite with embeddings required
        run: python -m unittest discover -s tests -v

  recall-performance:
    name: Recall correctness and performance report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cortex
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Measure synthetic recall and explicit-hint warming
        run: python scripts/benchmark_recall.py --size 200 --repetitions 20 --output "${RUNNER_TEMP}/cortex-recall-performance.json"

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Cortex
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compile tracked Python files
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Parse tracked shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: Check public files and XML assets
        run: python scripts/check_repository.py

      - name: Check whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
