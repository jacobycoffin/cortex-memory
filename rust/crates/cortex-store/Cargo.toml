[package]
name = "cortex-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Read-only access to an existing cortex.db. Never creates the file or writes meta.schema_version."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
