<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <title>cortex</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --text: #f5f6f8;
      --muted: #8993a5;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f5f8;
        --text: #171a22;
        --muted: #707b8e;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: clamp(14px, 3.6vw, 18px);
      line-height: 1.35;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
    }
    .tile {
      container-type: inline-size;
      box-sizing: border-box;
      width: min(100%, 960px);
      height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(10px, 2.2vh, 22px);
      padding:
        max(clamp(16px, 4vh, 48px), env(safe-area-inset-top))
        max(clamp(14px, 4vw, 48px), env(safe-area-inset-right))
        max(clamp(16px, 4vh, 48px), env(safe-area-inset-bottom))
        max(clamp(14px, 4vw, 48px), env(safe-area-inset-left));
    }
    pre {
      margin: 0;
      font: inherit;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #grid {
      white-space: pre;
      overflow-wrap: normal;
      letter-spacing: 0;
      line-height: 1.7;
      font-size: clamp(12px, calc((100cqw - 6px) / 24), 26px);
    }
    .grey, .state-no_data, .state-empty { color: var(--muted); }
    .skeleton-row {
      height: 1.15em;
      margin: 0 0 0.45em;
      border: 1px solid var(--muted);
    }
    #empty-store { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main class="tile">
    <pre id="notice" hidden aria-live="polite"></pre>
    <p id="empty-store" hidden>The store is empty. Memories, recall, and dreams show up here after the first write. An empty store is not a working store.</p>
    <div id="loading" aria-hidden="false">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
    <pre id="fallback" hidden>no data yet</pre>
    <pre id="status" hidden>cortex  <span id="pulse-memories" data-state-map="memories">not measurable yet</span> mem  recalled <span id="pulse-recalled" data-state-map="recalled">not measurable yet</span>  dreams: <span id="pulse-dream" data-state-map="dream">not run yet</span></pre>
    <pre id="asof" hidden></pre>
    <pre id="grid" hidden></pre>
  </main>
  <script>
    "use strict";

    /* cortex-measure:start */
    function isString(value) {
      return typeof value == "string";
    }
    function isNumber(value) {
      return typeof value == "number";
    }
    function hasKey(obj, key) {
      if (!obj) return false;
      return obj[key] != null;
    }
    function lower(value) {
      if (value == null) return "";
      return ("" + value).toLowerCase();
    }
    function agoLabel(hours) {
      if (hours == null) return "stale";
      if (hours < 24) {
        var rounded = Math.round(hours);
        if (rounded < 1) rounded = 1;
        return rounded + " h ago";
      }
      var days = Math.round(hours / 24);
      if (days < 1) days = 1;
      return days + " d ago";
    }
    function hourMinute(text) {
      if (!isString(text)) return "";
      var mark = text.indexOf("T");
      if (mark < 0) return "";
      var clock = text.substring(mark + 1, mark + 6);
      if (clock.length != 5) return "";
      if (text.substring(mark + 3, mark + 4) != ":") return "";
      return clock;
    }
    function ageHours(text, nowMs) {
      if (!isString(text)) return null;
      var ms = Date.parse(text);
      if (ms != ms) return null;
      return (nowMs - ms) / 3600000;
    }
    function renderMeasure(reading) {
      if (!reading) return { state: "no_data", text: "not measurable yet" };
      if (reading.kind == "dream" || reading.kind == "stamp") {
        var state = reading.state;
        if (state == null || state == "no_data" || state == "not run yet") {
          return { state: "no_data", text: "not run yet" };
        }
        if (state == "running") {
          if (reading.progress) return { state: "running", text: "running… " + reading.progress };
          return { state: "running", text: "running…" };
        }
        if (state == "stale") {
          var ago = reading.ago || "stale";
          return { state: "stale", text: ago + " ⚠" };
        }
        if (state == "failed") {
          if (reading.when) return { state: "failed", text: "failed " + reading.when };
          return { state: "failed", text: "failed" };
        }
        if (reading.when) return { state: "fresh", text: reading.when + " ✓" };
        return { state: "fresh", text: "fresh ✓" };
      }
      if (reading.emptyStore) return { state: "empty", text: "0", note: "the store is empty" };
      if (reading.running) {
        if (reading.progress) return { state: "running", text: "running… " + reading.progress };
        return { state: "running", text: "running…" };
      }
      if (reading.value == null || (reading.zeroIsAbsent && reading.value == 0)) {
        return { state: "no_data", text: "not measurable yet" };
      }
      if (reading.stale) {
        var mark = reading.ago || "stale";
        return { state: "stale", text: reading.value + " · " + mark + " ⚠" };
      }
      return { state: "fresh", text: reading.value + " ✓" };
    }
    function withFreshness(reading, at, nowMs, cadenceHours) {
      if (!reading) return { kind: "count", value: null };
      if (reading.emptyStore || reading.running || reading.value == null || reading.kind == "dream" || reading.kind == "stamp") return reading;
      var hours = ageHours(at, nowMs);
      if (hours != null && hours >= cadenceHours) {
        if (reading.zeroIsAbsent) return { kind: "count", value: reading.value, stale: true, ago: agoLabel(hours), zeroIsAbsent: true };
        return { kind: "count", value: reading.value, stale: true, ago: agoLabel(hours) };
      }
      return reading;
    }
    function memoryFromCounts(memories, note) {
      if (!memories) return { kind: "count", value: null };
      var keys = ["active", "cold", "archived", "other"];
      var sum = 0;
      var sawNumber = false;
      var i = 0;
      while (i < keys.length) {
        var key = keys[i];
        i = i + 1;
        if (!hasKey(memories, key)) continue;
        var value = memories[key];
        if (!isNumber(value)) return { kind: "count", value: null };
        sum = sum + value;
        sawNumber = true;
      }
      if (!sawNumber) return { kind: "count", value: null };
      if (sum == 0) return { kind: "count", emptyStore: true, value: 0 };
      return { kind: "count", value: sum };
    }
    function countOrAbsent(value) {
      if (value == null || value == 0) return { kind: "count", value: null, zeroIsAbsent: true };
      return { kind: "count", value: value };
    }
    function countReal(value) {
      if (value == null) return { kind: "count", value: null };
      return { kind: "count", value: value };
    }
    function progressReading(percent, active) {
      if (active) {
        var progress = "";
        if (percent != null) progress = Math.round(percent) + "%";
        return { kind: "count", running: true, progress: progress };
      }
      if (percent == null || percent == 0) return { kind: "count", value: null };
      return { kind: "count", value: Math.round(percent) + "%" };
    }
    function dreamFromPulse(dream, nowMs) {
      if (!dream) return { kind: "dream", state: "not run yet" };
      var state = dream.state;
      if (state == null || state == "no_data" || state == "not run yet") {
        return { kind: "dream", state: "not run yet" };
      }
      if (state == "running") return { kind: "dream", state: "running", progress: dream.progress || "" };
      var when = hourMinute(dream.at);
      if (state == "stale") {
        var hours = ageHours(dream.at, nowMs);
        var ago = "stale";
        if (hours != null) ago = agoLabel(hours);
        return { kind: "dream", state: "stale", ago: ago };
      }
      if (state == "failed") return { kind: "dream", state: "failed", when: when };
      if (state == "fresh") return { kind: "dream", state: "fresh", when: when };
      return { kind: "dream", state: "not run yet" };
    }
    function dreamFromRun(run, nowMs, runtime) {
      var runtimeStatus = "";
      if (runtime) runtimeStatus = lower(runtime.status);
      var status = "";
      if (run) status = lower(run.status);
      if (status == "running" || status == "started" || status == "in_progress" || runtimeStatus == "running" || runtimeStatus == "starting") {
        var progress = "";
        if (runtime && runtime.progress != null) progress = Math.round(runtime.progress) + "%";
        return { kind: "dream", state: "running", progress: progress };
      }
      if (!run) return { kind: "dream", state: "not run yet" };
      var at = run.completed_at;
      if (!at) at = run.started_at;
      var when = hourMinute(at);
      var hours = ageHours(at, nowMs);
      var within = false;
      if (hours != null && hours <= 36) within = true;
      if (status == "failed" && within) return { kind: "dream", state: "failed", when: when };
      if (within && (status == "completed" || status == "complete" || status == "success" || status == "succeeded" || status == "reverted" || status == "revert_partial")) {
        return { kind: "dream", state: "fresh", when: when };
      }
      var ago = "stale";
      if (hours != null) ago = agoLabel(hours);
      return { kind: "dream", state: "stale", ago: ago };
    }
    var COUNT_STALE_HOURS = 24;
    var DREAM_FRESH_HOURS = 36;
    /* cortex-measure:end */

    const GLYPHS = ["·", "░", "▒", "▓", "█"];
    const COLS = 40;
    const ROWS = 6;
    const INTERVAL_MS = 2000;
    const NO_DATA = "no data yet";
    const UNREACHABLE = "server unreachable";
    const NOT_MEASURABLE = "not measurable yet";

    function mapMemories(payload, now) {
      var status = payload && payload.status;
      var reading = memoryFromCounts(status && status.memories, payload && payload.note);
      var at = payload && (payload.observed_at || payload.received_at);
      return withFreshness(reading, at, now, COUNT_STALE_HOURS);
    }
    function mapRecalled(payload, now) {
      var status = payload && payload.status;
      var reading = countOrAbsent(status ? status.recalled_7d : null);
      var at = payload && (payload.observed_at || payload.received_at);
      return withFreshness(reading, at, now, COUNT_STALE_HOURS);
    }
    function mapDream(payload, now) {
      var status = payload && payload.status;
      return dreamFromPulse(status && status.last_dream, now);
    }
    const STATE_MAP = {
      memories: mapMemories,
      recalled: mapRecalled,
      dream: mapDream
    };

    const noticeEl = document.getElementById("notice");
    const statusEl = document.getElementById("status");
    const fallbackEl = document.getElementById("fallback");
    const asofEl = document.getElementById("asof");
    const gridEl = document.getElementById("grid");
    const emptyEl = document.getElementById("empty-store");
    const loadingEl = document.getElementById("loading");

    let timer = 0;
    let inflight = null;
    let epoch = 0;
    let requestId = 0;
    let last = null;

    function isLevel(n) {
      return typeof n === "number" && n === (n | 0) && n >= 0 && n <= 4;
    }

    function glyph(level) {
      return GLYPHS[level];
    }

    function gridText(buckets) {
      const lines = [];
      let row = "";
      for (let i = 0; i < buckets.length; i++) {
        row += glyph(buckets[i]);
        if (row.length === COLS || i === buckets.length - 1) {
          lines.push(row);
          row = "";
        }
      }
      return lines.join("\n");
    }

    function stamp(date) {
      const p = function (n) { return String(n).padStart(2, "0"); };
      return date.getFullYear() + "-" + p(date.getMonth() + 1) + "-" + p(date.getDate())
        + " " + p(date.getHours()) + ":" + p(date.getMinutes()) + ":" + p(date.getSeconds());
    }

    function paintMeasure(id, reading, muted) {
      var node = document.getElementById(id);
      if (!node) return;
      var view = renderMeasure(reading);
      var text = view.note ? view.text + " · " + view.note : view.text;
      node.textContent = text;
      node.dataset.state = view.state;
      node.className = "state-" + view.state;
      if (muted) node.style.color = "var(--muted)";
      else node.style.color = "";
    }

    function paint(frame, banner) {
      var stale = Boolean(banner) && Boolean(frame);
      noticeEl.hidden = !banner;
      noticeEl.textContent = banner || "";
      loadingEl.hidden = true;
      if (frame) {
        fallbackEl.hidden = true;
        statusEl.hidden = false;
        paintMeasure("pulse-memories", frame.memories, stale);
        paintMeasure("pulse-recalled", frame.recalled, stale);
        paintMeasure("pulse-dream", frame.dream, stale);
        gridEl.textContent = frame.gridText;
        asofEl.textContent = stale ? "as of " + frame.stamp : "";
        emptyEl.hidden = !frame.emptyStore;
      } else {
        statusEl.hidden = true;
        fallbackEl.hidden = false;
        fallbackEl.textContent = NO_DATA;
        gridEl.textContent = "";
        asofEl.textContent = "";
        emptyEl.hidden = true;
      }
      gridEl.hidden = !frame || frame.gridText.length === 0;
      asofEl.hidden = !stale;
      statusEl.classList.toggle("grey", stale);
      gridEl.classList.toggle("grey", stale);
      asofEl.classList.toggle("grey", stale);
      fallbackEl.classList.toggle("grey", Boolean(banner) && !frame);
      if (!gridEl.hidden) fitGrid();
    }

    function fitGrid() {
      gridEl.style.fontSize = "";
      const avail = gridEl.clientWidth;
      const needed = gridEl.scrollWidth;
      if (needed > avail + 1 && avail > 0) {
        const size = parseFloat(getComputedStyle(gridEl).fontSize);
        gridEl.style.fontSize = (size * avail / needed) + "px";
      }
    }

    function hold(banner) {
      paint(last, banner);
    }

    function remember(payload) {
      var now = Date.now();
      var stamped = {
        status: payload.status,
        note: payload.note,
        observed_at: payload.observed_at || new Date(now).toISOString(),
        received_at: new Date(now).toISOString()
      };
      var memories = STATE_MAP.memories(stamped, now);
      var view = renderMeasure(memories);
      last = {
        memories: memories,
        recalled: STATE_MAP.recalled(stamped, now),
        dream: STATE_MAP.dream(stamped, now),
        emptyStore: view.state === "empty" || payload.note === "the store is empty",
        gridText: gridText(payload.buckets),
        stamp: stamp(new Date())
      };
      paint(last, "");
    }

    function lineFromError(body) {
      if (body && typeof body.error === "string" && body.error) return body.error;
      if (body && typeof body.note === "string" && body.note) return body.note;
      return UNREACHABLE;
    }

    function accept(payload) {
      const bucketsOk = payload && payload.schema_version === 1
        && Array.isArray(payload.buckets) && payload.buckets.every(isLevel);
      if (!bucketsOk) {
        const banner = payload && typeof payload.error === "string" ? payload.error : "";
        if (banner) hold(banner);
        else if (!last) paint(null, "");
        return;
      }
      remember(payload);
    }

    function live(ticket, generation, signal) {
      return ticket === requestId && generation === epoch && !signal.aborted;
    }

    function pull() {
      if (document.visibilityState === "hidden") return;
      if (inflight) inflight.abort();
      const ticket = ++requestId;
      const generation = epoch;
      const controller = new AbortController();
      inflight = controller;
      const signal = controller.signal;
      fetch("/api/pulse?cols=" + COLS + "&rows=" + ROWS, {
        signal: signal,
        cache: "no-store",
        credentials: "same-origin",
        headers: { Accept: "application/json" }
      }).then(function (res) {
        if (!live(ticket, generation, signal)) return null;
        if (!res.ok) {
          return res.json().then(function (body) {
            if (live(ticket, generation, signal)) hold(lineFromError(body));
          }, function () {
            if (live(ticket, generation, signal)) hold(UNREACHABLE);
          });
        }
        return res.json().then(function (payload) {
          if (!live(ticket, generation, signal)) return;
          accept(payload);
        });
      }).catch(function (err) {
        if (err && err.name === "AbortError") return;
        if (!live(ticket, generation, signal)) return;
        hold(UNREACHABLE);
      });
    }

    function stop() {
      epoch += 1;
      if (timer) {
        clearInterval(timer);
        timer = 0;
      }
      if (inflight) {
        inflight.abort();
        inflight = null;
      }
    }

    function arm() {
      if (timer || document.visibilityState === "hidden") return;
      timer = setInterval(pull, INTERVAL_MS);
    }

    function start() {
      if (document.visibilityState === "hidden") return;
      pull();
      arm();
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") stop();
      else start();
    });
    window.addEventListener("pagehide", stop);
    window.addEventListener("resize", function () {
      if (!gridEl.hidden) fitGrid();
    });
    start();
  </script>
</body>
</html>
